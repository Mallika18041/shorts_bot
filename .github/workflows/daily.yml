name: Daily Telugu Short

on:
  schedule:
    - cron: "30 11 * * *"   # 5:00 PM IST every day (add another line for a second Short)
  workflow_dispatch: {}      # lets you also run it manually

permissions:
  contents: write
  actions: read

concurrency:
  group: shorts-state
  cancel-in-progress: false

jobs:
  make-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and Telugu font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f

      - run: pip install -r requirements.txt

      # Makes the Short and sends it to Telegram. Nothing is uploaded to YouTube yet.
      - name: Make today's Short and ask for approval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python make_short.py --preview

      # Keeps the full-quality video until you approve it
      - name: Save the video for later upload
        if: always() && hashFiles('output/pending/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shorts-run-${{ github.run_id }}
          path: output/pending
          retention-days: 30

      - name: Remember used topics and pending videos
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_topics.json
          [ -f state.json ] && git add state.json || true
          git diff --cached --quiet || (git commit -m "Update topics and state [skip ci]" && git pull --rebase -q && git push)
